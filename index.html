<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f3f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151118" />
    <meta name="description" content="Custom cake and cookie orders, without the DMs." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" />
    <title>Proofed</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var m = window.matchMedia('(prefers-color-scheme: dark)');
        function apply() { document.documentElement.classList.toggle('dark', m.matches); }
        apply();
        m.addEventListener('change', apply);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
